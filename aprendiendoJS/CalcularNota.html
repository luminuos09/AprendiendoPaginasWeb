<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcular Promedio Estudiante</title>
    <script src="CalcularNota.js" defer ></script>
    <style>
        body{
            text-align: center;

        }
        
    </style>
</head>
<body>

        <br>

        <br>

        <br>
        <br>
        <input type="submit" value="CalcularNota" id="CalcularNota">
        <p id="NotaMostrar"></p>
    </div>
    
    
</body>
